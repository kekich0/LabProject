name: CI/CD Pipeline

# Тригери для запуску pipeline
on:
  # Запуск при push у гілки
  push:
    branches:
      - main
      - develop

  # Запуск при створенні pull request
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Job для збірки та тестування
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Крок 1: Отримання коду з репозиторію
      - name: Checkout repository
        uses: actions/checkout@v4

      # Крок 2: Налаштування Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Крок 3: Встановлення залежності
      - name: Install dependencies
        run: npm ci

      # Крок 4: Перевірка лінтера
      - name: Run linter
        run: npm run lint

      # Крок 5: Запуск тестів
      - name: Run tests
        run: npm run test